<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 로그인 — 한성대학교 규정 마스터</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: linear-gradient(135deg, #EEF3FB 0%, #F0F4FA 100%);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
}
.card {
  background: #fff;
  border-radius: 20px;
  padding: 48px 44px 40px;
  width: 100%; max-width: 420px;
  box-shadow: 0 12px 48px rgba(0,48,135,0.13);
}
.logo-row {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 28px;
}
.logo-circle {
  width: 44px; height: 44px;
  background: #003087;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 22px;
}
.logo-text { font-size: 14px; font-weight: 700; color: #003087; line-height: 1.3; }
.logo-text small { display: block; font-size: 11px; font-weight: 400; color: #6B7A99; }
h2 { font-size: 22px; font-weight: 700; color: #1A2340; margin-bottom: 6px; }
.sub { font-size: 13px; color: #6B7A99; margin-bottom: 32px; }
label { display: block; font-size: 11px; font-weight: 700; color: #6B7A99; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
input {
  width: 100%; height: 48px;
  border: 1.5px solid #D1DCF0; border-radius: 10px;
  padding: 0 14px; margin-bottom: 16px;
  font-size: 14px; font-family: 'Noto Sans KR', sans-serif;
  color: #1A2340; outline: none; transition: border-color 0.2s;
}
input:focus { border-color: #0050B3; background: #FAFCFF; }
input::placeholder { color: #B0BDD4; }
.btn {
  width: 100%; height: 52px;
  border: none; border-radius: 12px;
  background: linear-gradient(150deg, #003087, #0060CC);
  color: #fff; font-weight: 700; font-size: 16px;
  cursor: pointer; font-family: 'Noto Sans KR', sans-serif;
  transition: all 0.2s; margin-top: 4px;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(0,48,135,0.3); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: none; }
.msg {
  margin-top: 14px; font-size: 13px; text-align: center;
  padding: 10px 14px; border-radius: 10px; display: none;
}
.msg.err { background: #FFF5F5; color: #C0392B; border: 1px solid #FFC5C5; display: block; }
.msg.ok  { background: #EAF3DE; color: #27500A; border: 1px solid #B8DFA0; display: block; }
.back { margin-top: 18px; text-align: center; font-size: 13px; color: #6B7A99; }
.back a { color: #003087; text-decoration: none; font-weight: 500; }
.back a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="card">
  <div class="logo-row">
    <div class="logo-circle">⚖</div>
    <div class="logo-text">한성대학교 규정 마스터<small>관리자 전용 페이지</small></div>
  </div>
  <h2>관리자 로그인</h2>
  <p class="sub">규정 파일 업로드를 위해 로그인하세요</p>

  <label for="uid">아이디</label>
  <input type="text" id="uid" placeholder="아이디 입력" autocomplete="username">

  <label for="upw">비밀번호</label>
  <input type="password" id="upw" placeholder="비밀번호 입력" autocomplete="current-password">

  <button class="btn" id="loginBtn" onclick="doLogin()">로그인</button>
  <div class="msg" id="msg"></div>

  <div class="back"><a href="/">← 메인으로 돌아가기</a></div>
</div>

<script>
// 관리자 로그인 페이지 진입 시 — 기존 토큰을 무조건 비워 로그인 폼을 다시 거치게 한다.
// (관리자 진입은 항상 첫 단계가 로그인이어야 함)
localStorage.removeItem('hsu_token');

document.getElementById('upw').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});

function showMsg(text, type) {
  var el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
}

async function doLogin() {
  var uid = document.getElementById('uid').value.trim();
  var upw = document.getElementById('upw').value;
  var btn = document.getElementById('loginBtn');
  var msg = document.getElementById('msg');

  // 메시지 초기화
  msg.className = 'msg';
  msg.textContent = '';

  if (!uid || !upw) {
    showMsg('아이디와 비밀번호를 입력하세요.', 'err');
    return;
  }

  btn.disabled = true;
  btn.textContent = '로그인 중...';

  try {
    var res = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: uid, password: upw })
    });

    var data = await res.json();

    if (!res.ok) {
      // 서버가 보낸 에러 메시지 표시
      throw new Error(data.detail || '로그인에 실패했습니다.');
    }

    // 토큰 저장
    localStorage.setItem('hsu_token', data.token);

    showMsg('✅ 로그인 성공! 이동 중...', 'ok');
    btn.disabled = true;

    setTimeout(function() {
      window.location.href = '/upload';
    }, 600);

  } catch(e) {
    showMsg(e.message || '서버에 연결할 수 없습니다.', 'err');
    btn.disabled = false;
    btn.textContent = '로그인';
  }
}
</script>
</body>
</html>
