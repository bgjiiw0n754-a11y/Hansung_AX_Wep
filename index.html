<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한성대학교 규정 마스터 AI</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --blue: #003087; --blue-mid: #0050B3; --blue-pale: #EEF3FB;
  --blue-border: #C5D4ED; --bg: #F0F4FA; --white: #FFFFFF;
  --text: #1A2340; --text-muted: #6B7A99; --border: #D1DCF0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { margin: 0 !important; padding: 0 !important; }
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

header {
  background:
    radial-gradient(ellipse 45% 80% at 93% 10%, rgba(249,115,22,0.20) 0%, transparent 68%),
    radial-gradient(ellipse 60% 100% at 50% -10%, rgba(96,165,250,0.16) 0%, transparent 65%),
    linear-gradient(148deg, #001254 0%, #002070 35%, #003899 70%, #0050B8 100%);
  position: relative; overflow: hidden;
}
header::before {
  content:''; position:absolute; width:520px; height:520px; border-radius:50%;
  background:rgba(255,255,255,0.025); top:-220px; right:-100px; pointer-events:none;
}
header::after {
  content:''; position:absolute; bottom:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg, transparent 0%, #60A5FA 28%, #F97316 58%, transparent 100%);
}
header .grid-overlay {
  position:absolute; inset:0; pointer-events:none;
  background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
}
.header-inner { max-width: 1400px; margin: 0 auto; padding: 40px 48px 36px; display: flex; align-items: center; justify-content: space-between; position: relative; gap: 32px; }
.header-left { flex: 1; text-align: left; }
.header-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); color: #93C5FD; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; padding: 5px 14px; border-radius: 20px; margin-bottom: 18px; }
header h1 { font-size: 48px; font-weight: 800; color: #fff; line-height: 1.2; margin-bottom: 12px; letter-spacing: -1px; text-align: left; }
header h1 span { color: #93C5FD; }
header p { font-size: 15px; color: rgba(255,255,255,0.72); font-weight: 300; text-align: left; }
.header-logo { display: flex; flex-direction: column; align-items: center; gap: 6px; flex-shrink: 0; margin-left: 32px; }
.logo-mark { width: 150px; height: 150px; background: rgba(255,255,255,0.95); border-radius: 50%; padding: 8px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 32px rgba(0,0,0,0.25); }
.logo-mark img { width: 134px; height: 134px; object-fit: contain; }
.mode-toggle { display: inline-flex; align-items: center; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.20); border-radius: 28px; padding: 3px; gap: 2px; margin-top: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.15); }
.mode-btn { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.55); padding: 6px 16px; border-radius: 20px; cursor: pointer; transition: all 0.22s; user-select: none; white-space: nowrap; }
.mode-btn.active { background: linear-gradient(135deg, #003087, #0050B3); color: #fff; box-shadow: 0 2px 10px rgba(0,48,135,0.40); }
.mode-btn:not(.active):hover { background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.9); }
#btnAdmin { border: 1px solid rgba(255,255,255,0.3); }
#btnAdmin:hover { background: rgba(255,255,255,0.2); color: #fff; }

.nav-bar { background: #001E5C; border-bottom: 1px solid rgba(255,255,255,0.08); }
.nav-inner { max-width: 960px; margin: 0 auto; padding: 0 32px; display: flex; align-items: center; }
.nav-item { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.5); padding: 10px 16px; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; white-space: nowrap; }
.nav-item.active { color: #fff; border-bottom-color: #60A5FA; }
.nav-item:hover { color: rgba(255,255,255,0.85); }
.nav-spacer { flex: 1; }


/* 앱 레이아웃 */
.app-body { display: flex; min-height: calc(100vh - 160px); }

/* 사이드바 */
.sidebar { width: 64px; min-width: 64px; background: #fff; border-right: 1px solid #D1DCF0; transition: width 0.28s cubic-bezier(0.4,0,0.2,1); overflow: hidden; flex-shrink: 0; box-shadow: 2px 0 16px rgba(0,48,135,0.07); position: sticky; top: 0; height: 100vh; }
.sidebar.open { width: 272px; }
.sidebar-toggle { width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-bottom: 1px solid #EEF3FB; transition: background 0.18s; }
.sidebar-toggle-icon { width: 36px; height: 36px; border-radius: 50%; background: #F0F4FA; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #6B7A99; transition: all 0.18s; box-shadow: 0 1px 4px rgba(0,48,135,0.08); }
.sidebar-toggle:hover .sidebar-toggle-icon { background: #EEF3FB; color: #003087; box-shadow: 0 2px 8px rgba(0,48,135,0.14); transform: scale(1.07); }
.sidebar-content { opacity: 0; pointer-events: none; transition: opacity 0.15s; min-width: 272px; padding: 14px 12px; text-align: left; }
.sidebar.open .sidebar-content { opacity: 1; pointer-events: auto; transition: opacity 0.22s 0.1s; }
.sidebar-title { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #6B7A99; margin-bottom: 12px; padding: 4px 6px 10px; border-bottom: 1px solid #EEF3FB; display: flex; justify-content: space-between; align-items: center; }
.sidebar-clear { font-size: 10px; color: #B0BDD4; cursor: pointer; padding: 3px 8px; border-radius: 20px; transition: all 0.15s; }
.sidebar-clear:hover { color: #E24B4A; background: #FFF0F0; }
.history-item { padding: 9px 10px; border-radius: 14px; cursor: pointer; margin-bottom: 5px; transition: all 0.15s; overflow: hidden; display: flex; align-items: center; gap: 6px; border: 1px solid transparent; }
.history-item:hover { background: #EEF3FB; border-color: #D1DCF0; }
.history-item.active { background: #EEF3FB; border-color: #C5D4ED; border-left: 3px solid #003087; }
.history-item-body { flex: 1; min-width: 0; cursor: pointer; }
.history-icon { width: 28px; height: 28px; border-radius: 50%; background: #F0F4FA; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; color: #6B7A99; transition: background 0.15s; }
.history-item:hover .history-icon { background: #D7E6FF; color: #003087; }
.history-item.active .history-icon { background: #C5D4ED; color: #003087; }
.history-q { font-size: 12px; font-weight: 500; color: #1A2340; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
.history-time { font-size: 10px; color: #6B7A99; margin-top: 2px; text-align: left; }
.history-del-btn { flex-shrink: 0; width: 22px; height: 22px; border: none; background: none; color: #C5D4ED; cursor: pointer; font-size: 12px; padding: 0; line-height: 1; border-radius: 50%; display: flex; align-items: center; justify-content: center; opacity: 0; transition: all 0.15s; }
.history-item:hover .history-del-btn { opacity: 1; }
.history-del-btn:hover { background: #FFF0F0; color: #C0392B; }

main { flex: 1; min-width: 0; max-width: none; margin: 0; padding: 28px 32px 60px; width: 100%; transition: padding 0.25s; }
main.chat-mode { padding: 12px 48px 24px; }
.page { display: none; }
.page.active { display: block; }

/* 타이핑 커서 */
.typing-cursor { display: inline-block; width: 2px; height: 1em; background: #003087; margin-left: 2px; vertical-align: text-bottom; animation: blink 0.8s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* 모드 배너 */
.mode-banner { display: flex; align-items: center; gap: 10px; background: var(--white); border: 1px solid var(--border); border-left: 4px solid var(--blue-mid); border-radius: 10px; padding: 12px 18px; margin-bottom: 20px; font-size: 13px; color: var(--text-muted); box-shadow: 0 1px 6px rgba(0,48,135,0.05); }
.mode-banner strong { color: var(--blue); font-weight: 700; }
.mode-banner-icon { font-size: 18px; }

/* 검색 */
.search-card { background: var(--white); border-radius: 14px; border: 1px solid var(--border); padding: 24px; margin-bottom: 24px; box-shadow: 0 2px 16px rgba(0,48,135,0.07); }
.search-label { font-size: 11px; font-weight: 700; color: var(--text-muted); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.search-label::before { content: ''; width: 3px; height: 14px; background: var(--blue-mid); border-radius: 2px; }
.search-row { display: flex; gap: 10px; }
textarea { flex: 1; border: 1.5px solid var(--border); border-radius: 10px; padding: 13px 16px; font-family: 'Noto Sans KR', sans-serif; font-size: 15px; resize: none; height: 80px; transition: border-color 0.2s; background: #F8FAFD; color: var(--text); line-height: 1.6; }
textarea:focus { outline: none; border-color: var(--blue-mid); background: #fff; }
textarea::placeholder { color: #B0BDD4; }
#askBtn:disabled { opacity: 0.55; cursor: not-allowed; }
.chips { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 7px; }
.chip { background: var(--blue-pale); border: 1px solid var(--blue-border); border-radius: 20px; padding: 5px 13px; font-size: 12px; font-weight: 500; color: var(--blue); cursor: pointer; transition: all 0.15s; }
.chip:hover { background: var(--blue); color: #fff; border-color: var(--blue); }

#loading { display: none; text-align: center; padding: 40px; color: var(--text-muted); font-size: 13px; }
.spinner { width: 32px; height: 32px; border: 2.5px solid var(--border); border-top-color: var(--blue-mid); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 10px; }
@keyframes spin { to { transform: rotate(360deg); } }

.answer-card { background: var(--white); border-radius: 14px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 16px; animation: fadeUp 0.3s ease; box-shadow: 0 2px 16px rgba(0,48,135,0.06); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.answer-header { background: linear-gradient(90deg, #EEF3FB, #F5F8FD); padding: 14px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
.answer-icon { width: 32px; height: 32px; background: var(--blue-mid); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; flex-shrink: 0; }
.answer-htxt { font-size: 13px; color: var(--text-muted); }
.answer-htxt strong { display: block; font-size: 14px; font-weight: 700; color: var(--text); }
.answer-body { padding: 22px; font-size: 15px; line-height: 1.95; white-space: pre-wrap; color: var(--text); }
.answer-body.nf { color: #9EADC8; font-style: italic; }

.sources { padding: 0 22px 22px; }
.src-label { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; }
.src-item { display: flex; align-items: flex-start; gap: 10px; padding: 11px 14px; background: #F8FAFD; border: 1px solid var(--border); border-radius: 9px; margin-bottom: 7px; transition: border-color 0.15s; }
.src-item:hover { border-color: var(--blue-mid); }
.src-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--blue-mid); margin-top: 5px; flex-shrink: 0; }
.src-title { font-size: 13px; font-weight: 700; color: var(--text); }
.src-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.src-score { margin-left: auto; font-size: 10px; font-weight: 700; color: var(--blue-mid); background: var(--blue-pale); padding: 2px 8px; border-radius: 8px; white-space: nowrap; }
.src-link { font-size: 11px; color: var(--blue-mid); text-decoration: none; margin-top: 3px; display: block; }
.src-link:hover { text-decoration: underline; }

.err { background: #FFF5F5; border: 1px solid #FFC5C5; border-radius: 10px; padding: 14px 18px; color: #C0392B; font-size: 13px; margin-bottom: 16px; }
.empty { text-align: center; padding: 56px 24px; color: var(--text-muted); }
.empty-icon { font-size: 40px; margin-bottom: 14px; opacity: 0.35; }
.empty p { font-size: 14px; line-height: 1.8; }

/* 담당부서 */
.dept-card { display: flex; align-items: center; gap: 14px; padding: 14px 18px; background: #EEF3FB; border: 1px solid #C5D4ED; border-radius: 12px; }
.dept-icon { width: 38px; height: 38px; background: #003087; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; flex-shrink: 0; }
.dept-info { flex: 1; }
.dept-name { font-size: 13px; font-weight: 700; color: #1A2340; }
.dept-phone { font-size: 12px; color: #6B7A99; margin-top: 2px; }
.dept-call-btn { padding: 8px 16px; background: #003087; color: #fff; border: none; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; white-space: nowrap; }
.dept-call-btn:hover { background: #0050B3; }

/* 추가질문 */
.followup-section { padding: 16px 22px; border-top: 1px solid #D1DCF0; }
.followup-label { font-size: 12px; font-weight: 700; color: #003087; margin-bottom: 10px; }
.followup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.followup-item { display: flex; align-items: center; gap: 8px; padding: 10px 13px; background: #F8FAFD; border: 1.5px solid #D1DCF0; border-radius: 10px; cursor: pointer; font-size: 12px; font-weight: 500; color: #1A2340; transition: all 0.15s; }
.followup-item:hover { border-color: #003087; background: #EEF3FB; color: #003087; }
.followup-item span:first-child { flex: 1; line-height: 1.5; }
.followup-arrow { color: #C5D4ED; font-size: 14px; flex-shrink: 0; }
.followup-item:hover .followup-arrow { color: #003087; }

/* 규정 시맨틱 검색 결과 */
.srule-card { background: #fff; border: 1px solid #D1DCF0; border-radius: 12px; margin-bottom: 8px; overflow: hidden; transition: border-color 0.15s; }
.srule-card:hover { border-color: #0050B3; }
.srule-header { display: flex; align-items: center; gap: 10px; padding: 13px 16px; cursor: pointer; }
.srule-info { flex: 1; min-width: 0; }
.srule-title { font-size: 13px; font-weight: 700; color: #1A2340; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srule-dept { font-size: 11px; color: #6B7A99; margin-top: 2px; }
.srule-preview { color: #9EADC8; font-weight: 400; }
.kw-highlight { background: none; color: #C0392B; font-weight: 700; }
.srule-score { font-size: 11px; font-weight: 700; color: #0050B3; background: #EEF3FB; padding: 2px 8px; border-radius: 8px; white-space: nowrap; flex-shrink: 0; }
.srule-link { font-size: 11px; color: #0050B3; text-decoration: none; white-space: nowrap; flex-shrink: 0; }
.srule-link:hover { text-decoration: underline; }
.srule-chunks { border-top: 1px solid #F0F4FA; display: none; background: #FAFCFF; }
.srule-card.open .srule-chunks { display: block; }
.srule-chunk { padding: 10px 16px; border-bottom: 1px solid #F0F4FA; }
.srule-chunk:last-child { border-bottom: none; }
.srule-chunk-art { font-size: 11px; font-weight: 700; color: #003087; margin-bottom: 4px; }
.srule-chunk-text { font-size: 12px; color: #6B7A99; line-height: 1.7; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.srule-empty { text-align: center; padding: 40px; color: #B0BDD4; font-size: 14px; }
.search-mode-tabs { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; }
.smode-tab { padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1.5px solid #D1DCF0; background: #fff; color: #6B7A99; transition: all 0.15s; font-family: 'Noto Sans KR', sans-serif; }
.smode-tab.active { background: #003087; color: #fff; border-color: #003087; }
.rules-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.rules-title { font-size: 18px; font-weight: 700; color: var(--text); }
.rules-count { font-size: 12px; color: var(--text-muted); background: var(--blue-pale); padding: 4px 12px; border-radius: 20px; border: 1px solid var(--blue-border); white-space: nowrap; }
.rules-search { display: flex; align-items: center; gap: 10px; background: var(--white); border: 1px solid var(--border); border-radius: 10px; padding: 10px 16px; margin-bottom: 20px; box-shadow: 0 1px 6px rgba(0,48,135,0.05); }
.rules-search input { flex: 1; border: none; outline: none; font-family: 'Noto Sans KR', sans-serif; font-size: 14px; color: var(--text); background: transparent; }
.rules-search input::placeholder { color: #B0BDD4; }
.rules-search-icon { color: var(--text-muted); font-size: 16px; }
.chapter-block { background: var(--white); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; overflow: hidden; box-shadow: 0 1px 6px rgba(0,48,135,0.04); }
.chapter-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; cursor: pointer; transition: background 0.15s; user-select: none; }
.chapter-header:hover { background: #F8FAFD; }
.chapter-left { display: flex; align-items: center; gap: 12px; }
.chapter-num { width: 32px; height: 32px; background: var(--blue); color: #fff; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
.chapter-name { font-size: 15px; font-weight: 700; color: var(--text); }
.chapter-right { display: flex; align-items: center; gap: 10px; }
.chapter-cnt { font-size: 12px; color: var(--text-muted); background: var(--blue-pale); padding: 3px 10px; border-radius: 12px; }
.chapter-arrow { font-size: 12px; color: var(--text-muted); transition: transform 0.2s; }
.chapter-block.open .chapter-arrow { transform: rotate(180deg); }
.rule-list { border-top: 1px solid var(--border); display: none; }
.chapter-block.open .rule-list { display: block; }
.rule-item { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-bottom: 1px solid #F0F4FA; transition: background 0.1s; }
.rule-item:last-child { border-bottom: none; }
.rule-item:hover { background: #F8FAFD; }
.rule-code { font-size: 11px; font-weight: 700; color: var(--blue-mid); background: var(--blue-pale); padding: 3px 8px; border-radius: 6px; white-space: nowrap; flex-shrink: 0; }
.rule-name { font-size: 14px; color: var(--text); flex: 1; }
.rule-dept { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
.rule-link { font-size: 11px; color: var(--blue-mid); text-decoration: none; white-space: nowrap; }
.rule-link:hover { text-decoration: underline; }
.rules-loading { text-align: center; padding: 40px; color: var(--text-muted); font-size: 13px; }
.no-result { text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px; }

.export-bar { display: flex; gap: 8px; padding: 12px 22px; border-top: 1px solid #D1DCF0; background: #F8FAFD; }
.export-btn { display: flex; align-items: center; gap: 6px; padding: 7px 16px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1.5px solid #C5D4ED; background: #fff; color: #003087; transition: all 0.15s; font-family: 'Noto Sans KR', sans-serif; }
.export-btn:hover { background: #003087; color: #fff; border-color: #003087; }
.export-btn:disabled { opacity: 0.5; cursor: not-allowed; }


@media (max-width:640px) {
  header h1 { font-size: 26px; }
  .header-logo { display: none; }
  .search-row { flex-direction: column; }
  main { padding: 20px 16px 60px; }
  main.chat-mode { padding: 12px 16px 16px; }
  .header-inner { padding: 24px 16px 20px; }
  .rule-dept { display: none; }
  .followup-grid { grid-template-columns: 1fr; }
  .chat-input-wrap { left: 64px !important; padding: 10px 16px 8px; }
  body.sidebar-open .chat-input-wrap { left: 64px !important; }
}
/* ── Diff Modal ── */
.diff-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:9999; display:none; align-items:center; justify-content:center; padding:16px; }
.diff-overlay.open { display:flex; }
.diff-modal { background:#fff; border-radius:16px; width:100%; max-width:1100px; max-height:92vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 24px 64px rgba(0,0,0,0.3); }
.diff-head { padding:16px 22px; border-bottom:1px solid #D1DCF0; display:flex; align-items:center; gap:12px; background:linear-gradient(90deg,#EEF3FB,#F5F8FD); flex-shrink:0; }
.diff-head-title { font-size:15px; font-weight:700; color:#1A2340; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.diff-ver-select { padding:5px 10px; border:1.5px solid #C5D4ED; border-radius:8px; font-family:'Noto Sans KR',sans-serif; font-size:12px; color:#1A2340; }
.diff-close { width:30px; height:30px; border:none; background:#F0F4FA; border-radius:50%; cursor:pointer; font-size:15px; color:#6B7A99; flex-shrink:0; }
.diff-close:hover { background:#E24B4A; color:#fff; }
.diff-cols { display:grid; grid-template-columns:1fr 1fr; flex:1; overflow:hidden; }
.diff-col { display:flex; flex-direction:column; overflow:hidden; }
.diff-col + .diff-col { border-left:2px solid #D1DCF0; }
.diff-col-head { padding:10px 16px; font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; border-bottom:1px solid #D1DCF0; flex-shrink:0; }

/* 사용자 말풍선 — 오른쪽 푸른 계열 */

.msg-user-bubble { max-width: 78%; background: linear-gradient(150deg, #DCE7FB, #C9DCF7); color: #0F2C5C;

<script>
const API = "";
let rulesData = null;


/* ── 페이지 전환 ── */
function showPage(name, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  el.classList.add('active');
  // 챗봇 페이지면 main 폭 늘리기 (좌우 빈 공간 줄임)
  document.querySelector('main').classList.toggle('chat-mode', name === 'search');
  if (name === 'list' && !rulesData) loadRules();
}


/* ── 사이드바 & 히스토리 ── */
const chatHistory = [];          // 대화 목록 (대화 1개 = {id, title, turns, time})
let currentChat = null;          // 현재 진행 중인 대화 객체

// localStorage에서 복원
(function loadStoredHistory() {
  try {
    const saved = localStorage.getItem('hsu_chat_history');
    if (!saved) return;
    const data = JSON.parse(saved);
    if (Array.isArray(data)) chatHistory.push(...data.slice(0, 30));
  } catch(e) {}
  renderHistory();
})();

function saveHistory() {
  try {
    localStorage.setItem('hsu_chat_history', JSON.stringify(chatHistory.slice(0, 30)));
  } catch(e) {}
}

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  sb.classList.toggle('open');
  document.body.classList.toggle('sidebar-open', sb.classList.contains('open'));
  document.getElementById('sidebarIcon').textContent = sb.classList.contains('open') ? '✕' : '☰';
}

// 첫 질문을 한 줄로 요약 (간략하게)
function summarizeTitle(q) {
  let t = q.trim().replace(/\s+/g, ' ');
  return t.length > 24 ? t.slice(0, 24) + '…' : t;
}

// 새 대화 시작
function newChat() {
  currentChat = null;
  renderChatStream();   // 빈 화면
  renderHistory();
  document.getElementById('questionInput').value = '';
  document.getElementById('questionInput').focus();
}

function renderHistory() {
  const list = document.getElementById('historyList');
  if (!chatHistory.length) {
    list.innerHTML = '<div style="font-size:12px;color:#B0BDD4;text-align:center;padding:20px 0">아직 대화가 없습니다</div>';
    return;
  }
  list.innerHTML = chatHistory.map(item => `
    <div class="history-item ${currentChat && currentChat.id === item.id ? 'active' : ''}" id="hist-${item.id}">
      <div class="history-icon">💬</div>
      <div class="history-item-body" onclick="restoreHistory(${item.id})">
        <div class="history-q">${item.title}</div>
        <div class="history-time">${item.time}</div>
      </div>
      <button class="history-del-btn" onclick="deleteHistoryItem(${item.id}, event)" title="삭제">✕</button>
    </div>`).join('');
}

function deleteHistoryItem(id, e) {
  e.stopPropagation();
  const idx = chatHistory.findIndex(v => v.id === id);
  if (idx === -1) return;
  chatHistory.splice(idx, 1);
  if (currentChat && currentChat.id === id) {
    currentChat = null;
    renderChatStream();
  }
  saveHistory();
  renderHistory();
}

function restoreHistory(id) {
  const item = chatHistory.find(v => v.id === id);
  if (!item) return;
  currentChat = item;
  renderChatStream();
  renderHistory();
  showPage('search', document.querySelectorAll('.nav-item')[0]);
}

function clearHistory() {
  if (!chatHistory.length) return;
  if (!confirm('대화 내역을 모두 삭제하시겠습니까?')) return;
  chatHistory.length = 0;
  currentChat = null;
  saveHistory();
  renderHistory();
  renderChatStream();
}

renderHistory();
renderChatStream();   // 초기 화면 그리기 (body.chat-empty 클래스도 자동 부여)
/* ── 타이핑 애니메이션 (실시간 소제목 볼드체 반영) ── */
function typeText(el, text, speed = 12) {
  return new Promise(resolve => {
    let i = 0;
    let currentText = '';
    
    function next() {
      if (i >= text.length) {
        resolve();
        return;
      }
      
      currentText += text[i++];
      
      // 글자가 추가될 때마다 실시간으로 줄 단위 분석 후 HTML 반환
      const lines = currentText.split('\n');
      const formattedHTML = lines.map((line, idx) => {
        const trimmed = line.trim();
        if (!trimmed) return '';
        
        // 현재 타이핑 중인 마지막 줄인지 확인
        const isLastLine = idx === lines.length - 1;
        
        // 이전 줄과 다음 줄이 비어있는지 체크 (원문 기준 구조 분석)
        const originalLines = text.split('\n');
        const prevEmpty = idx === 0 || !originalLines[idx - 1].trim();
        const nextEmpty = idx === originalLines.length - 1 || !originalLines[idx + 1].trim();
        
        // 소제목 조건 판별
        const isHeading = trimmed.length <= 22
          && !/^[-•*]/.test(trimmed)
          && !/^\d+[.)]\s/.test(trimmed)
          && prevEmpty 
          && (isLastLine ? true : nextEmpty); // 타이핑 중인 마지막 줄일 때는 다음 줄 공백 체크 유연하게 적용

        return isHeading ? `<b style="font-size:20px; color:#2F5A9E;">${trimmed}</b>` : trimmed;
      }).join('<br>'); // \n을 즉시 <br>로 치환하여 반영

      el.innerHTML = formattedHTML + '<span class="typing-cursor"></span>';
      
      setTimeout(next, speed);
    }
    next();
  });
}


/* ── 규정 통합 검색 ── */
let searchTimer = null;

function handleRuleSearch() {
  const q = document.getElementById('ruleSearch').value.trim();
  const clearBtn = document.getElementById('ruleSearchClear');
  clearBtn.style.display = q ? 'block' : 'none';

  clearTimeout(searchTimer);
  if (!q) {
    clearRuleSearch();
    return;
  }
  // 300ms 디바운스
  searchTimer = setTimeout(() => runUnifiedSearch(q), 300);
}

function clearRuleSearch() {
  document.getElementById('ruleSearch').value = '';
  document.getElementById('ruleSearchClear').style.display = 'none';
  document.getElementById('searchResultsWrap').style.display = 'none';
  document.getElementById('rulesList').style.display = '';
  document.getElementById('rulesCount').textContent = rulesData ? `총 ${rulesData.total}개 규정` : '로딩 중...';
}

async function runUnifiedSearch(q) {
  const wrap = document.getElementById('searchResultsWrap');
  const el   = document.getElementById('semanticResults');
  const list = document.getElementById('rulesList');

  wrap.style.display = '';
  list.style.display = 'none';
  el.innerHTML = '<div class="rules-loading"><div class="spinner"></div>검색 중...</div>';

  try {
    const res = await fetch(`${API}/search-rules`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q })
    });
    if (!res.ok) throw new Error('검색 실패');
    const data = await res.json();

    document.getElementById('rulesCount').textContent =
      data.results.length ? `${data.results.length}개 검색됨` : '검색 결과 없음';

    if (!data.results.length) {
      el.innerHTML = '<div class="srule-empty">관련 규정을 찾지 못했습니다.</div>';
      return;
    }

    el.innerHTML = data.results.map((r, i) => {
      const title = r.title.length > 40 ? r.title.slice(0, 40) + '…' : r.title;
      const preview = r.chunks[0]?.snippet ? highlightKeywords(r.chunks[0].snippet.slice(0,60), q) + '…' : '';
      return `
      <div class="srule-card open" id="sr-${i}">
        <div class="srule-header" onclick="toggleSrule(${i})">
          <div class="srule-info">
            <div class="srule-title">${title}</div>
            <div class="srule-dept">${r.department || ''}${preview ? ` · <span class="srule-preview">${preview}</span>` : ''}</div>
          </div>
          ${r.url ? `<a class="srule-link" href="${r.url}" target="_blank" onclick="event.stopPropagation()">원문 →</a>` : ''}
        </div>
        <div class="srule-chunks">
          ${r.chunks.map(c => `
            <div class="srule-chunk">
              <div class="srule-chunk-art">${c.article}</div>
              <div class="srule-chunk-text">${highlightKeywords(c.snippet, q)}</div>
            </div>`).join('')}
        </div>
      </div>`;
    }).join('');

    // 모두 열린 상태로 시작
  } catch(e) {
    el.innerHTML = `<div class="srule-empty">오류: ${e.message}</div>`;
  }
}

function highlightKeywords(text, q) {
  if (!text || !q) return text;
  const keywords = q.split(' ').filter(w => w.length >= 2);
  let result = text;
  keywords.forEach(kw => {
    const escaped = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    result = result.replace(new RegExp(escaped, 'gi'),
      m => `<mark class="kw-highlight">${m}</mark>`);
  });
  return result;
}

}

// 답변 본문 포맷 (소제목 볼드)
function formatAnswerHTML(text) {
  const lines = (text || '').split('\n');
  return lines.map((line, i) => {
    const trimmed = line.trim();
    if (!trimmed) return '';
    const prevEmpty = i === 0 || !lines[i-1].trim();
    const nextEmpty = i === lines.length-1 || !lines[i+1].trim();
    const isHeading = trimmed.length <= 22
      && !/^[-•*]/.test(trimmed)
      && !/^\d+[.)]\s/.test(trimmed)
      && prevEmpty && nextEmpty;
    return isHeading ? `<b style="font-size:18px; color:#2F5A9E;">${trimmed}</b>` : trimmed;
  }).join('\n');
}

function escHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// 답변에 딸린 부가정보(참조조항/담당부서/연관질문/내보내기) HTML 생성
function buildExtras(question, data) {
  let src = '';
  if (data.sources && data.sources.length > 0) {
    // ① 답변 텍스트에서 실제 인용된 조 번호 추출 (예: '제56조', '제 56 조')
    const ans = (data.answer || '').replace(/\s+/g, '');
    const citedNums = new Set((ans.match(/제\d+조/g) || []));

    // ② 인용된 조항만 통과 — 인용이 없으면 참조 조항 섹션 자체를 생략
    //    (관련 없는 조항이 뜨는 걸 방지)
    let relevant = [];
    if (citedNums.size > 0) {
      relevant = data.sources.filter(s => {
        if (!s.article) return false;
        const a = s.article.replace(/\s+/g, '');
        return [...citedNums].some(n => a.includes(n));
      });
    }

    // ③ '(제정 2016...)' 같은 메타데이터성 출처 필터
    const cleanSources = relevant.filter(s =>
      !/^\(?(제정|개정|시행|폐지)\s*\d{4}/.test(s.title || ''));

    // ④ 같은 규정 + 같은 조항은 1개만
    //    (url에 쿼리스트링 등 미세한 차이가 있어도 합쳐지도록 title+article만 사용)
    //    article도 공백·괄호·구두점 다 빼고 비교 (예: '제3조 (목적)' = '제3조(목적)')
    const normalize = s => (s || '').replace(/[\s()（）\[\]·,.~\-_]/g, '');
    const seen = new Set();
    const unique = [];
    cleanSources.forEach(s => {
      const key = normalize(s.title) + '|' + normalize(s.article);
      if (seen.has(key)) return;
      seen.add(key);
      unique.push(s);
    });

    // ⑤ 같은 규정이면 조항만 합쳐 1줄로 (예: 제5조 · 제7조)
    const grouped = {}; const order = [];
    unique.forEach(s => {
      const key = normalize(s.title) + '|' + (s.url || '');
      if (!grouped[key]) { grouped[key] = { ...s, articles: [] }; order.push(key); }
      if (s.article && !grouped[key].articles.includes(s.article)) {
        grouped[key].articles.push(s.article);
      }
    });

    if (order.length > 0) {
      src = `<div class="sources"><div class="src-label">참조 조항</div>${order.map(key => {
        const s = grouped[key];
        let title = s.title || '규정';
        if (/^제\d+조/.test(title) || title.length > 25) title = title.slice(0, 25) + '…';
        const articleStr = s.articles.length ? s.articles.join(' · ') : (s.article || '');
        return `<div class="src-item"><div class="src-dot"></div>
          <div><div class="src-title">${escHtml(title)}</div>
          <div class="src-meta">${escHtml(articleStr)}${s.department ? ' · ' + escHtml(s.department) : ''}</div>
          ${s.url ? `<a class="src-link" href="${s.url}" target="_blank">원문 보기 →</a>` : ''}</div>
        </div>`;
      }).join('')}</div>`;
    }
  }

  let deptHtml = '';
  if (data.dept) {
    const phone = data.dept_phone || '02-760-4114';
    deptHtml = `<div class="dept-card-wrap">
      <div class="dept-card"><div class="dept-icon">📞</div>
        <div class="dept-info"><div class="dept-name">${escHtml(data.dept)}</div><div class="dept-phone">${escHtml(phone)}</div></div>
      </div></div>`;
  }

  // 연관 질문 - 항상 4개 보장 (AI가 적게 주면 일반 fallback으로 채움)
  let followupHtml = '';
  let followups = (data.followups || [])
    .map(q => q.replace(/^Q:\s*/i, '').replace(/\s*A:[\s\S]*/i, '').trim())
    .filter(Boolean);
  // 부족하면 일반 fallback 추가 (중복 회피)
  const fallback = [
    '관련 규정 원문은 어디서 볼 수 있나요?',
    '담당 부서에 직접 문의하려면 어떻게 하나요?',
    '비슷한 사례에는 어떤 게 있나요?',
    '예외 조항은 없나요?',
  ];
  for (const f of fallback) {
    if (followups.length >= 4) break;
    if (!followups.includes(f)) followups.push(f);
  }
  followups = followups.slice(0, 4);
  const items = followups.map(clean =>
    `<div class="followup-item" onclick="askFollowup(this.dataset.q)" data-q="${escHtml(clean)}">
      <span>${escHtml(clean)}</span><span class="followup-arrow">›</span></div>`
  ).join('');
  followupHtml = `<div class="followup-section">
    <div class="followup-label">💡 이어서 물어보기</div>
    <div class="followup-grid">${items}</div></div>`;

  const isDiffQ = /뭐가 바뀌|어떻게 바뀌|개정 내용|개정사항|변경사항|달라진|차이/.test(question);
  const diffBtnTitle = data.sources?.[0]?.title || '';
  const diffBtn = (isDiffQ && diffBtnTitle)
    ? `<button class="export-btn" onclick="openDiffModal('${diffBtnTitle.replace(/'/g,"\\'")}')">🔍 버전 비교</button>` : '';
  const exportBar = data.found ? `<div class="export-bar">
    <button class="export-btn" onclick="exportAnswerData(this)">⬇ PDF</button>
    <button class="export-btn" onclick="exportAnswerData(this,'docx')">⬇ Word</button>
    ${diffBtn}</div>` : '';

  return src + deptHtml + followupHtml + exportBar;
}

// 부드러운 자동 스크롤 - 페이지 맨 아래로
function scrollToBottom() {

    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    // 이미지/폰트 로드 후 한 번 더 보정

  });

// AI 답변 타이핑 애니메이션
function typeAnswer(bodyEl, text, onDone) {
  const formatted = formatAnswerHTML(text || '');
  // 글자 단위 타이핑 - 한 번에 여러 글자 (속도)
  bodyEl.innerHTML = '<span class="typing-cursor"></span>';
  let i = 0;
  const total = formatted.length;
  const step = Math.max(2, Math.floor(total / 280));  // 너무 길면 빠르게
  const interval = 14;  // ms

  // HTML 태그 단위로 자르면 깨지므로 글자 단위로 잘라 보이는 만큼만 사용 + 끝에 cursor
  function tick() {
    i = Math.min(total, i + step);
    // 미완성 태그가 잘리지 않도록 마지막 '<' 이후 미완료 태그 제거
    let visible = formatted.slice(0, i);
    const lastLt = visible.lastIndexOf('<');
    const lastGt = visible.lastIndexOf('>');
    if (lastLt > lastGt) visible = visible.slice(0, lastLt);
    bodyEl.innerHTML = visible + '<span class="typing-cursor"></span>';
    // 스크롤 따라가기
    if (i % (step * 8) === 0) scrollToBottom();
    if (i < total) {
      setTimeout(tick, interval);
    } else {
      bodyEl.innerHTML = formatted;  // 마지막엔 커서 없이 완성형
      if (onDone) onDone();
    }
  }
  tick();
}

async function ask() {
  const input = document.getElementById('questionInput');
  const q = input.value.trim();
  if (!q) return;
  const btn = document.getElementById('askBtn');
  const stream = document.getElementById('chatStream');

  // 새 대화면 생성 + 로그에 등록 (첫 질문일 때만 로그 추가)
  if (!currentChat) {
    const now = new Date();
    const time = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
    currentChat = {
      id: Date.now(),
      title: summarizeTitle(q),
      time: time,
      turns: [],
      messages: [{ role: 'system', content: '한성대학교 규정 기반 AI 챗봇' }]
    };
    chatHistory.unshift(currentChat);
    document.getElementById('sidebar').classList.add('open');
    document.body.classList.add('sidebar-open');
    document.getElementById('sidebarIcon').textContent = '✕';
    // 빈 안내 화면 비우기
    // 빈 안내(추천 카드) 화면 비우기
    // 빈 안내(추천 카드) 화면 비우기 + 페이지 스크롤 허용
    if (stream.querySelector('.chat-welcome')) stream.innerHTML = '';
    document.body.classList.remove('chat-empty');
  }

  input.value = '';
  input.style.height = '42px';
  btn.disabled = true;

  // ① 사용자 질문 즉시 말풍선으로 표시
  const userDiv = document.createElement('div');
  userDiv.className = 'msg-user';
  userDiv.innerHTML = `<div class="msg-user-bubble">${escHtml(q)}</div>`;
  stream.appendChild(userDiv);

  // ② 로딩 메시지 즉시 표시
  const loadingEl = document.createElement('div');
  loadingEl.className = 'chat-loading';
  loadingEl.innerHTML = '<div class="spinner"></div><span>규정을 검색하는 중<span class="dots"></span></span>';
  stream.appendChild(loadingEl);
  scrollToBottom();

  try {
    currentChat.messages.push({ role: 'user', content: q });
    const res = await fetch(`${API}/query`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, messages: currentChat.messages })
    });
    if (!res.ok) { const err = await res.json(); throw new Error(err.detail || '서버 오류'); }
    const data = await res.json();
    currentChat.messages.push({ role: 'assistant', content: data.answer });
    currentChat.turns.push({ q: q, data: data });
    saveHistory();
    renderHistory();

    // ③ 로딩 제거하고 AI 답변 박스 만들기
    loadingEl.remove();
    const bodyCls = data.found === false ? ' nf' : '';
    const aiDiv = document.createElement('div');
    aiDiv.className = 'msg-ai';
    aiDiv.innerHTML = `
      <div class="msg-ai-head"><div class="msg-ai-icon">⚖</div><div class="msg-ai-name">규정 AI 답변</div></div>
      <div class="msg-ai-body${bodyCls}"></div>
      <div class="msg-ai-extras" style="display:none"></div>`;
    stream.appendChild(aiDiv);
    const body = aiDiv.querySelector('.msg-ai-body');
    const extras = aiDiv.querySelector('.msg-ai-extras');

    // ④ 타이핑 애니메이션
    typeAnswer(body, data.answer || '', () => {
      extras.innerHTML = buildExtras(q, data);
      extras.style.display = '';
      scrollToBottom();
    });
  } catch(e) {
    loadingEl.remove();
    const errDiv = document.createElement('div');
    errDiv.className = 'msg-ai';
    errDiv.innerHTML = `
      <div class="msg-ai-head"><div class="msg-ai-icon">⚖</div><div class="msg-ai-name">규정 AI 답변</div></div>
      <div class="msg-ai-body nf">오류: ${escHtml(e.message)}\n서버가 실행 중인지 확인하세요.</div>`;
    stream.appendChild(errDiv);
    currentChat.turns.push({ q: q, data: { answer: '오류: ' + e.message, found: false } });
    scrollToBottom();
  } finally {
    btn.disabled = false;
    input.focus();
  }
}

// 마지막 답변 내보내기 (현재 대화의 마지막 turn)
async function exportAnswerData(btn, fmt) {
  fmt = fmt || 'pdf';
  if (!currentChat || !currentChat.turns.length) { alert('먼저 질문을 해주세요.'); return; }
  const last = currentChat.turns[currentChat.turns.length - 1];
  const data = last.data;
  const origText = btn.textContent;
  btn.disabled = true; btn.textContent = '생성 중...';
  try {
    const res = await fetch(`${API}/export/${fmt}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: '규정 답변 리포트', content: data.answer,
        sources: data.sources || [], question: last.q })
    });
    if (!res.ok) throw new Error(`서버 오류 (${res.status})`);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `규정답변.${fmt === 'pdf' ? 'pdf' : 'docx'}`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  } catch(e) {
    alert('내보내기 실패: ' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = origText;
  }
}



/* ── 초기화 ── */
/* ── Diff Modal ── */
let _diffData = null;

async function openDiffModal(title) {
  document.getElementById('diffOverlay').classList.add('open');
  document.getElementById('diffTitle').textContent = title + ' 버전 비교';
  document.getElementById('diffOldBody').innerHTML = '<div class="diff-spin"><div class="spinner"></div>불러오는 중...</div>';
  document.getElementById('diffNewBody').innerHTML = '';
  document.getElementById('diffVerSelect').innerHTML = '';

  try {
    const res = await fetch(`${API}/diff`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({question: title})
    });
    if (!res.ok) throw new Error('diff 로드 실패');
    _diffData = await res.json();

    const sel = document.getElementById('diffVerSelect');
    if (!_diffData.pairs || !_diffData.pairs.length) {
      document.getElementById('diffOldBody').innerHTML = '<div class="diff-empty">개정 이력이 없거나 변경된 조항이 없습니다.</div>';
      return;
    }
    _diffData.pairs.forEach((p, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = `${p.from_date} → ${p.to_date}`;
      sel.appendChild(opt);
    });
    renderDiffPair();
  } catch(e) {
    document.getElementById('diffOldBody').innerHTML = `<div class="diff-empty">오류: ${e.message}</div>`;
  }
}

function closeDiff() {
  document.getElementById('diffOverlay').classList.remove('open');
}

function renderDiffPair() {
  if (!_diffData) return;
  const idx  = parseInt(document.getElementById('diffVerSelect').value) || 0;
  const pair = _diffData.pairs[idx];
  if (!pair) return;

  document.getElementById('diffOldHead').textContent = `← 이전 버전 (${pair.from_date})`;
  document.getElementById('diffNewHead').textContent = `최신 버전 (${pair.to_date}) →`;

  let leftHtml = '', rightHtml = '';
  for (const art of pair.articles) {
    const sep = `<div class="diff-art-sep">${art.name}</div>`;
    const {lh, rh} = charDiff(art.old || '', art.new || '');
    leftHtml  += sep + lh + '\n\n';
    rightHtml += sep + rh + '\n\n';
  }

  document.getElementById('diffOldBody').innerHTML = leftHtml || '<div class="diff-empty">변경 없음</div>';
  document.getElementById('diffNewBody').innerHTML = rightHtml || '<div class="diff-empty">변경 없음</div>';
}

function charDiff(oldStr, newStr) {
  const MAX = 1800;
  if (oldStr.length > MAX) oldStr = oldStr.slice(0, MAX) + '…';
  if (newStr.length > MAX) newStr = newStr.slice(0, MAX) + '…';

  const ol = oldStr.length, nl = newStr.length;
  const dp = Array.from({length: ol+1}, () => new Uint16Array(nl+1));
  for (let i = 1; i <= ol; i++)
    for (let j = 1; j <= nl; j++)
      dp[i][j] = oldStr[i-1] === newStr[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j], dp[i][j-1]);

  const ops = [];
  let i = ol, j = nl;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && oldStr[i-1] === newStr[j-1]) {
      ops.unshift({t:'s', c:oldStr[i-1]}); i--; j--;
    } else if (j > 0 && (i === 0 || dp[i][j-1] >= dp[i-1][j])) {
      ops.unshift({t:'a', c:newStr[j-1]}); j--;
    } else {
      ops.unshift({t:'d', c:oldStr[i-1]}); i--;
    }
  }

  const esc = c => c === '\n' ? '<br>' : c.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let lh = '', rh = '';
  for (const op of ops) {
    if (op.t === 's') { lh += esc(op.c); rh += esc(op.c); }
    else if (op.t === 'd') lh += `<mark class="diff-del">${esc(op.c)}</mark>`;
    else rh += `<mark class="diff-add">${esc(op.c)}</mark>`;
  }
  return {lh, rh};
}
</script>

<!-- 스크롤 점프 버튼 -->
<button class="scroll-jump top" id="scrollTopBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="맨 위로">↑</button>
<button class="scroll-jump bottom" id="scrollBottomBtn" onclick="window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})" title="맨 아래로">↓</button>

<script>
// 스크롤 위치 따라 점프 버튼 표시
(function setupScrollJump() {
  const topBtn = document.getElementById('scrollTopBtn');
  const botBtn = document.getElementById('scrollBottomBtn');
  function update() {
    const y = window.scrollY;
    const max = document.body.scrollHeight - window.innerHeight;
    // 스크롤 가능 영역이 거의 없으면 둘 다 숨김
    if (max < 200) { topBtn.classList.remove('show'); botBtn.classList.remove('show'); return; }
    topBtn.classList.toggle('show', y > 200);          // 어느 정도 내렸을 때만 ↑ 표시
    botBtn.classList.toggle('show', y < max - 200);    // 끝에 거의 다 왔을 땐 ↓ 숨김
  }
  window.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update);
  update();
})();
</script>
